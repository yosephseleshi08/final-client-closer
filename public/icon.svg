<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Outer Target Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="6" stroke-dasharray="16 12" opacity="0.6" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#glowGrad)" stroke-width="8" opacity="0.8" />

  <!-- Center Hexagon / Shield Backdrop -->
  <circle cx="256" cy="256" r="90" fill="#1e1b4b" fill-opacity="0.9" />

  <!-- Center Bolt / Target Closer Icon -->
  <g filter="url(#glow)">
    <path d="M 276 130 L 196 266 L 246 266 L 236 382 L 326 236 L 272 236 Z" fill="url(#glowGrad)" />
  </g>

  <!-- Pulse Dots -->
  <circle cx="256" cy="76" r="10" fill="#38bdf8" />
  <circle cx="436" cy="256" r="10" fill="#ec4899" />
  <circle cx="256" cy="436" r="10" fill="#8b5cf6" />
  <circle cx="76" cy="256" r="10" fill="#10b981" />
</svg>
